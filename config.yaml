# Master Configuration for Customer Email Triage Automation
# NOTE: In accordance with our security principles, ZERO API keys or secrets are stored here.
# Any external credential uses the strict `*_env` convention referencing environment variables.

system:
  database_path: "triage.db"
  idempotency_stale_minutes: 10
  max_dispatch_retries: 3
  audit_log_enabled: true
  persist_masked_text: true

privacy:
  # Local spaCy NER model (runs 100% locally on CPU)
  spacy_model: "en_core_web_sm"
  # Technical terms and infrastructure tools whitelist for PII masker
  tech_terms_file: "config/tech_terms.txt"
  # Technical context words for disambiguating ambiguous tools (A10)
  tech_context_words:
    - "pipeline"
    - "job"
    - "jobs"
    - "build"
    - "builds"
    - "cluster"
    - "broker"
    - "brokers"
    - "topic"
    - "topics"
    - "server"
    - "node"
    - "nodes"
    - "version"
    - "release"
    - "error"
    - "app"
    - "chart"
    - "deployment"
    - "container"
    - "plugin"
    - "agent"
    - "queue"
    - "consumer"
    - "producer"
    - "instance"
  # Default country region code for parsing national-format phone numbers (ISO 3166-1 alpha-2)
  default_phone_region: "US"
  # Tuned sensitive keywords and intent phrases for B2B (<15% false diversion SLA)
  # NOTE: config.yaml is the SINGLE SOURCE OF TRUTH for sensitive keywords.
  sensitive_keywords:
    # High-liability documents & credentials
    - "passport"
    - "driver's license"
    - "national id"
    - "nid"
    # Law enforcement intent phrases (replaces bare "police")
    - "police report"
    - "contacted the police"
    - "contact the police"
    - "contacting the police"
    - "police investigation"
    - "filed a police"
    - "police department"
    - "alerted the police"
    - "report to the police"
    # Legal actions & court processes
    - "lawsuit"
    - "court order"
    - "legal notice"
    - "subpoena"
    - "my lawyer"
    - "cease and desist"
    - "arbitration demand"
    - "preservation demand"
    - "preservation order"
    - "litigation"
    # Financial disputes & banking details (broad chargeback rule retained)
    - "chargeback"
    - "will file a chargeback"
    - "filing chargeback"
    - "filing a chargeback"
    - "chargeback filed"
    - "formal chargeback"
    - "dispute notice"
    - "disputing this charge"
    - "bank account details"
    - "banking details"
    - "bank details"
    - "wire transfer routing"
    - "wire transfer instructions"
    - "routing number"
    - "wage garnishment"
    # Privacy & regulatory intent phrases (replaces bare "gdpr", "erasure", "dsar", "ccpa")
    - "gdpr erasure request"
    - "right to erasure"
    - "right to be forgotten"
    - "under article 17"
    - "data subject access request"
    - "subject access request"
    - "dsar request"
    - "ccpa request"
    - "ccpa deletion request"
    - "do not sell my personal information"
    - "do not sell"
    - "data breach"
  # Max count of [NUM] / [CODE] tokens before triggering sensitive-skip
  max_code_density: 4

security:
  # Heuristic regex scan bounds to mitigate ReDoS and padding attacks
  regex_scan_head: 10000
  regex_scan_tail: 2000

gatekeeper:
  # Primary gatekeeper: TypeSafe System One (Jev)
  timeout_seconds: 5.0
  max_retries: 2
  api_key_env: "JEV_API_KEY"
  # Fallback fast classifier if Jev AI is unavailable or times out
  fallback_model: "openai/gpt-oss-20b"
  groq_api_key_env: "GROQ_API_KEY"
  jev:
    model: "jev-1.13.0"
    api_url: "https://api.typesafe.ai/v1/systemone"
    hi_threshold: 0.85
    lo_threshold: 0.15
    max_body_chars: 20000

llm:
  model: "openai/gpt-oss-120b"
  groq_api_key_env: "GROQ_API_KEY"
  temperature: 0.1
  confidence_threshold: 0.70

classification:
  primary: "jev"                     # Primary engine: TypeSafe System One choice router
  fallback: "groq"                   # Secondary engine: Groq LLM (openai/gpt-oss-120b)
  hitl_threshold: 0.85               # Diverts to HITL review queue if confidence < 0.85
  always_review_categories:
    - "Security/Account"
  max_subject_chars: 2000            # Bounded scan limit for subject (A6 defense)
  max_body_chars: 10000              # Bounded scan limit for body (A6 defense)
  jev:
    enabled: false                   # Disabled by default: Jev's 4 routing choices cannot express the 10-category taxonomy
    model: "jev-1.13.0"
    api_url: "https://api.typesafe.ai/v1/systemone"
    router_question_id: "gmail_router"
    timeout_seconds: 5.0

destinations:
  Engineering:
    service: "github"
    target: "my-company/backend-repo"
    token_env: "GITHUB_TOKEN"
    labels: ["bug", "triage-bot"]
    use_masked_text_only: true

  Support:
    service: "freescout"
    target: "https://support.mycompany.com"
    api_key_env: "FREESCOUT_API_KEY"
    mailbox_id: 1
    use_masked_text_only: false

  Sales:
    service: "crm"
    target_env: "CRM_API_ENDPOINT"
    api_key_env: "CRM_API_KEY"
    use_masked_text_only: false

  Billing:
    service: "webhook"
    target_env: "SLACK_BILLING_WEBHOOK_URL"
    use_masked_text_only: false
