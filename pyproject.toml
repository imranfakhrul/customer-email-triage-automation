[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "S", "T20", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["nodes", "utils", "db", "state", "pipeline", "prompts"]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use assert, hardcoded mock tokens, pseudo-randomness, and print statements
"tests/*" = ["S101", "S105", "S106", "S311", "BLE001", "T20"]
# CLI and tool entrypoint files legitimately print to stdout
"main.py" = ["T20", "BLE001", "E501", "F841", "SIM118", "UP006", "UP015", "UP035", "UP045"] # TODO(lint): legacy baseline
"scripts/*" = ["T20"]
"tools/*" = ["T20"]

# Baseline debt for existing modules (TODO: resolve lint warnings in future refactors)
