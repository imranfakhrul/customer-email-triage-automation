[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = false
files = [
    "nodes",
    "utils",
    "db",
    "main.py",
    "pipeline.py",
    "state.py",
    "prompts.py",
]

[[tool.mypy.overrides]]
module = ["db.database", "nodes.pii_masker", "utils.classifier_client", "utils.jev_client", "pipeline"]
# TODO(lint): legacy modules with type debt
ignore_errors = true

[[tool.mypy.overrides]]
module = ["nodes.classifier", "nodes.hitl_queue"]
disallow_untyped_defs = true

[tool.bandit]
exclude_dirs = ["venv", "tests", ".git", "data"]
skips = ["B110"]
